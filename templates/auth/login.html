{% extends 'base.html' %}
{% block title %}Sign in – snickr{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-sm-10 col-md-7 col-lg-5 col-xl-4">

    <div class="text-center mb-4">
      <h1 class="fw-bold fs-2">
        <i class="bi bi-lightning-charge-fill text-warning"></i> snickr
      </h1>
      <p class="text-muted">Sign in to your workspace</p>
    </div>

    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <form method="POST" action="{{ url_for('auth.login') }}" novalidate>

          <div class="mb-3">
            <label for="username" class="form-label fw-semibold">Username</label>
            <input type="text" class="form-control form-control-lg" id="username"
                   name="username" value="{{ username or '' }}"
                   placeholder="your_username" autocomplete="username" autofocus required />
          </div>

          <div class="mb-4">
            <div class="d-flex justify-content-between">
              <label for="password" class="form-label fw-semibold">Password</label>
            </div>
            <input type="password" class="form-control form-control-lg" id="password"
                   name="password" placeholder="••••••••"
                   autocomplete="current-password" required />
          </div>

          <button type="submit" class="btn btn-primary btn-lg w-100 fw-semibold">
            <i class="bi bi-box-arrow-in-right me-1"></i> Sign in
          </button>
        </form>
      </div>
    </div>

    <p class="text-center mt-3 text-muted">
      Don't have an account?
      <a href="{{ url_for('auth.register') }}" class="fw-semibold">Create one</a>
    </p>

  </div>
</div>
{% endblock %}
